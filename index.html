<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>骚坤大合成</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: linear-gradient(180deg, #1a2a4a 0%, #0f1b33 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  #wrap {
    width: min(100vw, 480px);
    height: 100%;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px;
    position: relative;
  }
  header {
    width: 100%;
    text-align: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 26px;
    background: linear-gradient(90deg, #ffd86b, #ff9966);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .subtitle { font-size: 12px; color: #8fa3c8; margin-top: 2px; }
  .stats {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
    gap: 8px;
    flex-shrink: 0;
  }
  .score-box {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 6px 14px;
    text-align: center;
    flex: 1;
  }
  .score-box .label { font-size: 11px; color: #8fa3c8; }
  .score-box .val { font-size: 20px; font-weight: 700; color: #ffd86b; font-variant-numeric: tabular-nums; }
  .next-box {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 4px 14px;
    text-align: center;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .next-box .label { font-size: 11px; color: #8fa3c8; }
  .next-box .emoji { font-size: 26px; line-height: 1.15; }
  #toolbar { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.08);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .1s, background .2s;
    flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn:hover { background: rgba(255,255,255,.16); }
  #stage {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  footer {
    margin-top: 6px;
    font-size: 11px;
    color: #6b7fa5;
    text-align: center;
    flex-shrink: 0;
  }
  /* 游戏结束弹层 */
  #overlay {
    position: absolute; inset: 0;
    background: rgba(10, 16, 30, .72);
    backdrop-filter: blur(4px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 20;
    border-radius: 16px;
  }
  #overlay.show { display: flex; }
  #overlay .big-emoji { font-size: 56px; }
  #overlay h2 { font-size: 24px; color: #ffd86b; }
  #overlay .final { font-size: 14px; color: #b8c6e0; }
  #overlay .final b { font-size: 22px; color: #fff; }
  .btn {
    border: none;
    border-radius: 14px;
    padding: 12px 34px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #4a2800;
    background: linear-gradient(180deg, #ffd86b, #ff9f43);
    box-shadow: 0 6px 18px rgba(255, 160, 60, .35);
    transition: transform .1s;
  }
  .btn:active { transform: scale(.94); }
  /* 合成表弹层 */
  #chainPop {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(.8);
    background: rgba(18, 26, 48, .97);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 16px;
    padding: 18px 22px;
    z-index: 30;
    display: none;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    max-width: 92%;
  }
  #chainPop.show { display: block; opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #chainPop h3 { font-size: 15px; margin-bottom: 10px; color: #ffd86b; text-align: center; }
  #chainRow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 360px; align-items: center; }
  #chainRow .cell { text-align: center; }
  #chainRow .cell .e { font-size: 24px; }
  #chainRow .cell .s { font-size: 10px; color: #8fa3c8; }
  #chainRow .arrow { color: #5a6f96; font-size: 13px; }
  #chainPop .close { margin-top: 12px; text-align: center; }
  #chainPop .close span { cursor: pointer; color: #8fa3c8; font-size: 12px; text-decoration: underline; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>🎮 骚坤大合成</h1>
    <div class="subtitle">相同的撞在一起，越合越大 · 变成超大坤坤吧</div>
  </header>

  <div class="stats">
    <div class="score-box">
      <div class="label">本局得分</div>
      <div class="val" id="score">0</div>
    </div>
    <div class="next-box">
      <div class="label">下一个</div>
      <div class="emoji" id="nextEmoji">🐣</div>
    </div>
    <div id="toolbar">
      <button class="icon-btn" id="btnChain" title="合成表">📖</button>
      <button class="icon-btn" id="btnSound" title="音效">🔊</button>
      <button class="icon-btn" id="btnRestart" title="重开">↻</button>
    </div>
    <div class="score-box">
      <div class="label">最高分</div>
      <div class="val" id="best">0</div>
    </div>
  </div>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <div class="big-emoji">🎯</div>
      <h2>游戏结束</h2>
      <div class="final">本局得分 <b id="finalScore">0</b>　最高分 <b id="finalBest">0</b></div>
      <div id="newRecord" style="display:none;color:#ff9f43;font-size:13px;">🎉 新纪录！</div>
      <button class="btn" id="btnRetry">再来一局</button>
    </div>
    <div id="chainPop">
      <h3>📜 合成升级路线</h3>
      <div id="chainRow"></div>
      <div class="close"><span id="chainClose">收起</span></div>
    </div>
  </div>

  <footer>鼠标移动瞄准 · 点击投放 · ←/→ 微调 · 空格投放 · R 重开</footer>
</div>

<script>
/* ============ 配置：合成链（自定义图片版） ============
 * 用法：把 11 张图片放到本文件同目录，命名为 img1.png ~ img11.png
 *       （1 最小 → 11 最大；扩展名也支持 .jpg/.jpeg/.webp/.gif，自动识别）
 *       某一级没放图片时，自动用 e 字段的 Emoji 代替。
 *       r = 半径(可调)，s = 合成时的得分。
 * ================================================== */
const CHAIN = [
  { e: "🐣", img: "img1.png",  r: 16,  s: 1 },
  { e: "🐤", img: "img2.png",  r: 21,  s: 3 },
  { e: "🐥", img: "img3.png",  r: 27,  s: 6 },
  { e: "🐰", img: "img4.png",  r: 34,  s: 10 },
  { e: "🐱", img: "img5.png",  r: 42,  s: 15 },
  { e: "🐶", img: "img6.png",  r: 51,  s: 21 },
  { e: "🦊", img: "img7.png",  r: 61,  s: 28 },
  { e: "🐻", img: "img8.png",  r: 72,  s: 36 },
  { e: "🦁", img: "img9.png",  r: 84,  s: 45 },
  { e: "🐯", img: "img10.png", r: 97,  s: 55 },
  { e: "🐲", img: "img11.png", r: 112, s: 66 },
];

/* ================= 自定义图片加载（带扩展名回退） ================= */
const IMG_EXTS = ["png", "jpg", "jpeg", "webp", "gif"];
const IMGS = {};   // { 等级: Image对象 }

function loadLevelImage(lv) {
  const base = `img${lv + 1}`;
  const tryExt = (i) => {
    if (i >= IMG_EXTS.length) return;          // 全部不存在 → 用 Emoji 兜底
    const src = `${base}.${IMG_EXTS[i]}`;
    const im = new Image();
    im.onload = () => {
      IMGS[lv] = im;
      updateNextUI();
      buildChainTable();
    };
    im.onerror = () => tryExt(i + 1);
    im.src = src;
  };
  tryExt(0);
}
CHAIN.forEach((c, i) => loadLevelImage(i));

/* ================= 画布与坐标 ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const W = 420;                    // 逻辑宽度
let H = 620;                      // 逻辑高度（随窗口比例动态计算）
const DEAD_Y = 130;               // 死亡线
let scale = 1;

function resize() {
  const rect = stage.getBoundingClientRect();
  canvas.width = Math.round(rect.width * devicePixelRatio);
  canvas.height = Math.round(rect.height * devicePixelRatio);
  scale = canvas.width / W;
  H = canvas.height / scale;      // 保持等比缩放，物理与渲染一致
}
window.addEventListener("resize", resize);

/* ================= 游戏状态 ================= */
let balls = [];        // {x,y,vx,vy,r,lv,age,dead}
let particles = [];    // 合成特效
let score = 0;
let best = +(localStorage.getItem("mergeAnimalsBest") || 0);
let nextLv = randDrop();
let currentLv = randDrop();
let aimX = W / 2;
let dropY = 70;
let canDrop = true;
let dropCooldown = 0;
let gameOver = false;
let soundOn = true;
let lastTime = 0;

document.getElementById("best").textContent = best;

function randDrop() {
  // 偏向小等级，偶尔给中级
  const pool = [0,0,0,0,1,1,1,2,2,3,3,4];
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ================= 音效（WebAudio 合成，无外部资源） ================= */
let AC = null;
function beep(freq, dur = 0.08, type = "sine", vol = 0.25) {
  if (!soundOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g).connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const sndDrop  = () => beep(320, .06, "triangle", .18);
const sndMerge = (lv) => beep(300 + lv * 60, .12, "sine", .3);
const sndOver  = () => { beep(220,.2,"sawtooth",.2); setTimeout(()=>beep(150,.3,"sawtooth",.2),150); };

/* ================= 物理 ================= */
const GRAV = 1500;        // px/s²
const REST = 0.12;        // 弹性
const AIR  = 0.999;

function step(dt) {
  const sub = 3;
  const h = dt / sub;
  for (let s = 0; s < sub; s++) {
    for (const b of balls) {
      b.age += h;
      b.vy += GRAV * h;
      b.vx *= AIR; b.vy *= AIR;
      b.x += b.vx * h;
      b.y += b.vy * h;
      // 墙壁
      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx) * REST; }
      if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * REST; }
      if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy) * REST; b.vx *= 0.985; }
    }
    // 两两碰撞（含合成）
    resolveCollisions();
  }
}

function resolveCollisions() {
  const merged = new Set();
  for (let i = 0; i < balls.length; i++) {
    const a = balls[i];
    if (merged.has(a)) continue;
    for (let j = i + 1; j < balls.length; j++) {
      const b = balls[j];
      if (merged.has(b)) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minD = a.r + b.r;
      if (dist >= minD || dist === 0) continue;

      // 相同等级 → 合成
      if (a.lv === b.lv && a.lv < CHAIN.length - 1) {
        merged.add(a); merged.add(b);
        doMerge(a, b);
        continue;
      }

      // 位置修正 + 冲量
      const nx = dx / dist, ny = dy / dist;
      const overlap = minD - dist;
      const total = a.r * a.r + b.r * b.r;
      a.x -= nx * overlap * (b.r * b.r / total);
      a.y -= ny * overlap * (b.r * b.r / total);
      b.x += nx * overlap * (a.r * a.r / total);
      b.y += ny * overlap * (a.r * a.r / total);

      const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
      const vn = rvx * nx + rvy * ny;
      if (vn > 0) continue;
      const imp = -(1 + REST) * vn / 2;
      a.vx -= imp * nx; a.vy -= imp * ny;
      b.vx += imp * nx; b.vy += imp * ny;
    }
  }
  if (merged.size) balls = balls.filter(b => !merged.has(b));
}

function doMerge(a, b) {
  const lv = a.lv + 1;
  const cfg = CHAIN[lv];
  const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
  balls.push({
    x, y,
    vx: (a.vx + b.vx) / 4, vy: (a.vy + b.vy) / 4,
    r: cfg.r, lv, age: 0
  });
  score += CHAIN[a.lv].s + CHAIN[lv].s;
  document.getElementById("score").textContent = score;
  sndMerge(lv);
  // 特效
  for (let k = 0; k < 14; k++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 180;
    particles.push({
      x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 60,
      life: .5 + Math.random() * .3, max: .8, r: 2 + Math.random() * 3,
      color: `hsl(${38 + Math.random() * 30}, 90%, ${60 + Math.random() * 25}%)`
    });
  }
  if (lv === CHAIN.length - 1) {
    // 合成终极动物：大特效
    for (let k = 0; k < 40; k++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 100 + Math.random() * 350;
      particles.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: .8 + Math.random() * .5, max: 1.3, r: 2 + Math.random() * 5,
        color: `hsl(${Math.random() * 360}, 90%, 65%)`
      });
    }
    beep(523,.15,"sine",.3); setTimeout(()=>beep(659,.15,"sine",.3),120); setTimeout(()=>beep(784,.25,"sine",.3),240);
  }
}

/* ================= 投放 ================= */
function drop() {
  if (!canDrop || gameOver) return;
  const cfg = CHAIN[currentLv];
  balls.push({ x: aimX, y: dropY, vx: 0, vy: 50, r: cfg.r, lv: currentLv, age: 0 });
  currentLv = nextLv;
  nextLv = randDrop();
  updateNextUI();
  canDrop = false;
  dropCooldown = 0.45;
  sndDrop();
}

function updateNextUI() {
  const el = document.getElementById("nextEmoji");
  const im = IMGS[nextLv];
  el.innerHTML = im
    ? `<img src="${im.src}" style="width:28px;height:28px;object-fit:contain;display:block;margin:0 auto;">`
    : CHAIN[nextLv].e;
}

/* ================= 游戏结束判定 ================= */
function checkGameOver(dt) {
  if (gameOver) return;
  let danger = false;
  for (const b of balls) {
    if (b.y - b.r < DEAD_Y && b.age > 0.6 && Math.abs(b.vy) < 260 && Math.abs(b.vx) < 260) {
      danger = true; break;
    }
  }
  if (danger) {
    overTimer += dt;
    if (overTimer > 1.6) endGame();
  } else overTimer = Math.max(0, overTimer - dt * 2);
}
let overTimer = 0;

function endGame() {
  gameOver = true;
  sndOver();
  const isNew = score > best;
  if (isNew) { best = score; localStorage.setItem("mergeAnimalsBest", best); }
  document.getElementById("best").textContent = best;
  document.getElementById("finalScore").textContent = score;
  document.getElementById("finalBest").textContent = best;
  document.getElementById("newRecord").style.display = isNew && score > 0 ? "block" : "none";
  document.getElementById("overlay").classList.add("show");
}

function restart() {
  balls = []; particles = [];
  score = 0; overTimer = 0;
  gameOver = false; canDrop = true;
  currentLv = randDrop(); nextLv = randDrop();
  updateNextUI();
  document.getElementById("score").textContent = 0;
  document.getElementById("overlay").classList.remove("show");
}

/* ================= 渲染 ================= */
function draw(t) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  // 背景
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#24365e");
  g.addColorStop(1, "#16223e");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 装饰网格点
  ctx.fillStyle = "rgba(255,255,255,.04)";
  for (let x = 20; x < W; x += 40)
    for (let y = 20; y < H; y += 40)
      ctx.fillRect(x - 1, y - 1, 2, 2);

  // 死亡线
  const flashing = overTimer > 0.35 && Math.floor(t / 150) % 2 === 0;
  ctx.strokeStyle = flashing ? "rgba(255,90,90,.95)" : "rgba(255,255,255,.22)";
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.moveTo(0, DEAD_Y); ctx.lineTo(W, DEAD_Y); ctx.stroke();
  ctx.setLineDash([]);

  // 瞄准辅助线 + 待投放
  if (!gameOver) {
    const cfg = CHAIN[currentLv];
    ctx.strokeStyle = "rgba(255,255,255,.15)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(aimX, dropY); ctx.lineTo(aimX, H); ctx.stroke();
    drawBall(aimX, dropY, cfg, t, true);
  }

  // 球体
  for (const b of balls) drawBall(b.x, b.y, CHAIN[b.lv], t, false, b);

  // 特效粒子
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBall(x, y, cfg, t, ghost, b) {
  const pulse = ghost ? 1 + Math.sin(t / 300) * 0.04 : 1;
  const r = cfg.r * pulse;

  // 底色圆
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  const g = ctx.createRadialGradient(x - r * .35, y - r * .45, r * .1, x, y, r);
  g.addColorStop(0, "rgba(255,255,255,.28)");
  g.addColorStop(.55, "rgba(255,255,255,.10)");
  g.addColorStop(1, "rgba(0,0,0,.25)");
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = ghost ? "rgba(255,255,255,.5)" : "rgba(255,255,255,.35)";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 图案：优先自定义图片（圆形裁剪、cover 适配），否则 Emoji 兜底
  const img = IMGS[CHAIN.indexOf(cfg)] || null;
  ctx.globalAlpha = ghost ? .85 : 1;
  if (img) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    // cover：等比缩放铺满圆形
    const s = Math.max((2 * r) / img.naturalWidth, (2 * r) / img.naturalHeight);
    const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    ctx.drawImage(img, x - dw / 2, y - dh / 2, dw, dh);
    ctx.restore();
  } else {
    ctx.font = `${Math.round(r * 1.35)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(cfg.e, x, y + r * 0.06);
  }
  ctx.globalAlpha = 1;
}

/* ================= 主循环 ================= */
function loop(t) {
  const dt = Math.min(0.032, (t - lastTime) / 1000 || 0.016);
  lastTime = t;

  if (dropCooldown > 0) {
    dropCooldown -= dt;
    if (dropCooldown <= 0) canDrop = true;
  }

  if (!gameOver) {
    step(dt);
    checkGameOver(dt);
    // 粒子
    for (const p of particles) {
      p.life -= dt;
      p.vy += 800 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  draw(t);
  requestAnimationFrame(loop);
}

/* ================= 输入 ================= */
function toLocalX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) / rect.width * W;
}
canvas.addEventListener("mousemove", e => { aimX = clampAim(toLocalX(e.clientX)); });
canvas.addEventListener("click", e => { aimX = clampAim(toLocalX(e.clientX)); drop(); });
canvas.addEventListener("touchstart", e => { e.preventDefault(); aimX = clampAim(toLocalX(e.touches[0].clientX)); }, { passive: false });
canvas.addEventListener("touchmove", e => { e.preventDefault(); aimX = clampAim(toLocalX(e.touches[0].clientX)); }, { passive: false });
canvas.addEventListener("touchend", e => { e.preventDefault(); drop(); }, { passive: false });

function clampAim(x) {
  const r = CHAIN[currentLv].r;
  return Math.max(r + 2, Math.min(W - r - 2, x));
}

window.addEventListener("keydown", e => {
  if (e.code === "ArrowLeft") aimX = clampAim(aimX - 18);
  else if (e.code === "ArrowRight") aimX = clampAim(aimX + 18);
  else if (e.code === "Space") { e.preventDefault(); drop(); }
  else if (e.code === "KeyR") restart();
});

/* ================= 按钮 ================= */
document.getElementById("btnRestart").onclick = restart;
document.getElementById("btnRetry").onclick = restart;
document.getElementById("btnSound").onclick = function () {
  soundOn = !soundOn;
  this.textContent = soundOn ? "🔊" : "🔇";
};

// 合成表（图片加载完成后会自动重建以显示图片）
const chainRow = document.getElementById("chainRow");
function buildChainTable() {
  chainRow.innerHTML = "";
  CHAIN.forEach((c, i) => {
    if (i > 0) {
      const ar = document.createElement("span");
      ar.className = "arrow"; ar.textContent = "→";
      chainRow.appendChild(ar);
    }
    const cell = document.createElement("div");
    cell.className = "cell";
    const im = IMGS[i];
    const face = im
      ? `<img src="${im.src}" style="width:26px;height:26px;object-fit:contain;display:block;margin:0 auto;">`
      : c.e;
    cell.innerHTML = `<div class="e">${face}</div><div class="s">${c.s}分</div>`;
    chainRow.appendChild(cell);
  });
}
buildChainTable();
document.getElementById("btnChain").onclick = () =>
  document.getElementById("chainPop").classList.toggle("show");
document.getElementById("chainClose").onclick = () =>
  document.getElementById("chainPop").classList.remove("show");

/* ================= 启动 ================= */
resize();
updateNextUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
